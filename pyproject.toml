[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "finsler-flow-matching"
version = "1.0.0"
description = "Finsler Flow Matching: dynamics-aware geodesic interpolation for single-snapshot trajectory inference"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Niklas Canova" }, { name = "Jonas Simon Fleck" }]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pot>=0.9",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0"]
singlecell = ["anndata>=0.10", "scanpy>=1.10", "scvelo>=0.3", "cellrank>=2.0"]
baselines = ["torchcfm>=1.0"]
test = ["pytest>=7", "pytest-cov>=4"]
docs = ["sphinx>=7", "furo", "myst-nb>=1.0", "sphinx-copybutton"]

[project.urls]
Homepage = "https://github.com/mlbelab/FinslerFlowMatching"
Documentation = "https://github.com/mlbelab/FinslerFlowMatching/tree/main/docs"
Paper = "https://arxiv.org/abs/2610.11318"
Source = "https://github.com/mlbelab/FinslerFlowMatching"

[tool.setuptools.packages.find]
include = ["ffm*"]

[tool.setuptools.package-data]
"ffm.core.vendor" = ["LICENSE-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["ffm"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
